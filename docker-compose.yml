name: springai-knowledge

x-restart-policy: &restart_policy
  restart: unless-stopped

x-timezone: &timezone
  TZ: Asia/Shanghai

services:
  postgres:
    <<: *restart_policy
    build:
      context: ./docker
      dockerfile_inline: |
        FROM pgvector/pgvector:0.8.2-pg17
        COPY postgres-init.sql /docker-entrypoint-initdb.d/01-init.sql
    image: springai-postgres:1.0.0
    container_name: springai-postgres
    environment:
      <<: *timezone
      POSTGRES_DB: ${DB_NAME:-springai_knowledge}
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${PG_PASSWORD:?PG_PASSWORD is required}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ${DB_NAME:-springai_knowledge}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - springai-net

  rabbitmq:
    <<: *restart_policy
    image: rabbitmq:4.3-management-alpine
    container_name: springai-rabbitmq
    environment:
      <<: *timezone
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is required}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - springai-net

  app:
    <<: *restart_policy
    build:
      context: .
      dockerfile_inline: |
        FROM eclipse-temurin:21-jre-jammy
        WORKDIR /app
        # curl 用于 docker-compose 的 healthcheck (actuator/health)
        RUN apt-get update && apt-get install -y --no-install-recommends curl \
            && rm -rf /var/lib/apt/lists/*
        COPY target/springai-knowledge-server-1.0.0.jar app.jar
        EXPOSE 8080
        ENTRYPOINT ["java","-jar","/app/app.jar"]
    image: springai-knowledge-server:1.0.0
    container_name: springai-app
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    ports:
      - "${APP_PORT:-80}:8080"
    environment:
      <<: *timezone
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-springai_knowledge}
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: ${PG_PASSWORD:?PG_PASSWORD is required}
      PG_PASSWORD: ${PG_PASSWORD:?PG_PASSWORD is required}

      SPRING_JPA_HIBERNATE_DDL_AUTO: update

      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: admin
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is required}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is required}

      SILICONFLOW_API_KEY: ${SILICONFLOW_API_KEY:?SILICONFLOW_API_KEY is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
    volumes:
      - app_data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks:
      - springai-net

networks:
  springai-net:
    driver: bridge

volumes:
  pg_data:
  rabbitmq_data:
  app_data:
