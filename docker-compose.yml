name: springai-knowledge

x-restart-policy: &restart_policy
  restart: unless-stopped

x-timezone: &timezone
  TZ: Asia/Shanghai

services:
  postgres:
    <<: *restart_policy
    build:
      context: ./docker
      dockerfile: postgres.Dockerfile
    image: springai-postgres:1.0.0
    container_name: springai-postgres
    environment:
      <<: *timezone
      POSTGRES_DB: ${DB_NAME:-springai_knowledge}
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${PG_PASSWORD:?PG_PASSWORD is required}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - /opt/docker/springai-knowledge/postgresql/data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ${DB_NAME:-springai_knowledge}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - springai-net

  rabbitmq:
    <<: *restart_policy
    image: rabbitmq:4.3-management-alpine
    container_name: springai-rabbitmq
    environment:
      <<: *timezone
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is required}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - /opt/docker/springai-knowledge/rabbitmq:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - springai-net

  app:
    <<: *restart_policy
    build:
      context: .
      dockerfile: Dockerfile
    image: springai-knowledge-server:1.0.0
    container_name: springai-app
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      <<: *timezone
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-springai_knowledge}
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: ${PG_PASSWORD:?PG_PASSWORD is required}
      PG_PASSWORD: ${PG_PASSWORD:?PG_PASSWORD is required}

      SPRING_JPA_HIBERNATE_DDL_AUTO: update

      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: admin
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is required}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is required}

      SILICONFLOW_API_KEY: ${SILICONFLOW_API_KEY:?SILICONFLOW_API_KEY is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
    volumes:
      - /opt/docker/springai-knowledge/app/data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks:
      - springai-net

networks:
  springai-net:
    driver: bridge
