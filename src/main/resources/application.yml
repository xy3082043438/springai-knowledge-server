spring:
  application:
    name: springai-knowledge-server

  datasource:
    url: jdbc:postgresql://${SERVER_IP:localhost}:5432/${DB_NAME:springai_knowledge}
    username: postgres
    password: ${PG_PASSWORD}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      leak-detection-threshold: 60000

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  rabbitmq:
    host: ${SERVER_IP:localhost}
    username: admin
    password: ${RABBITMQ_PASSWORD}
    listener:
      simple:
        acknowledge-mode: manual
        prefetch: 1
        concurrency: 2
        max-concurrency: 5

  ai:
    openai:
      base-url: https://api.siliconflow.cn
      api-key: ${SILICONFLOW_API_KEY}
      chat:
        options:
          model: Qwen/Qwen3-14B
      embedding:
        options:
          model: BAAI/bge-large-zh-v1.5
    vectorstore:
      pgvector:
        dimensions: 1024
        initialize-schema: true
        table-name: document_embedding
        id-type: TEXT

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

security:
  jwt:
    secret: ${JWT_SECRET}
    expiration-seconds: 3600

app:
  upload:
    path: ./data/uploads
  admin:
    username: ${ADMIN_USERNAME:admin}
    password: ${ADMIN_PASSWORD:admin123}
  document:
    storage-path: ./data/documents
    chunk-size: 1000
    chunk-overlap: 200
    embedding-safe-chunk-size: 320
  rag:
    answer-style: 简洁、准确、专业
    max-answer-chars: 300
    max-output-tokens: 512
    temperature: 0.2
    top-p: 0.9
  config:
    cache-ttl-ms: 2000
  openai:
    connect-timeout-ms: 3000
    read-timeout-ms: 20000
  hybrid:
    top-k: 6
    vector-top-k: 6
    vector-similarity-threshold: 0.2
    keyword-top-k: 6
    vector-weight: 0.7
    keyword-weight: 0.3
    rrf-k: 60
  keyword:
    ts-config: simple
  rerank:
    enabled: true
    base-url: https://api.siliconflow.cn/v1/rerank
    model: BAAI/bge-reranker-v2-m3
    top-n: 6
    max-docs: 30
    connect-timeout-ms: 3000
    read-timeout-ms: 5000
